<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2fb985">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' blob: data:; connect-src https: http://127.0.0.1:* http://localhost:*; manifest-src 'self'; worker-src 'self'">
<title>Claude Office</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="dot" id="conn-dot"></span><b>Claude Office</b><span id="conn-text" class="sub"></span></div>
  <div class="top-btns">
    <button id="refresh-btn" class="icon-btn" aria-label="refresh">⟳</button>
    <button id="menu-btn" class="icon-btn" aria-label="members"><i></i><i></i><i></i></button>
  </div>
</header>
<div id="ptr"><div class="spin"></div></div>
<main id="view"></main>
<div id="sheet-back" hidden></div>
<section id="sheet" hidden></section>
<div id="toast" hidden></div>
<div id="drawer-back" hidden></div>
<aside id="drawer" hidden></aside>
<nav id="tabs"></nav>
<script src="app.js"></script>
</body>
</html>
